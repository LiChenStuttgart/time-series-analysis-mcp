[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "time-series-analysis-mcp"
version = "0.1.0"
description = "Enterprise-oriented MCP server for multi-dimensional time-series analysis and forecasting."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LiChenStuttgart", email = "3380836@gmail.com" }
]
license = { text = "MIT" }
keywords = [
    "mcp",
    "model-context-protocol",
    "time-series",
    "forecasting",
    "data-quality",
    "stationarity",
    "seasonality",
]
dependencies = [
    "mcp>=1.0,<2",
    "pydantic>=2.0,<3",
    "numpy>=1.24,<3",
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
scientific = [
    "pandas>=1.5,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.2,<2",
    "openpyxl>=3.0,<4",
    "xlrd>=2.0,<3",
    "arch>=6.0,<8",
    "ruptures>=1.1,<2",
]
chronos2 = [
    "chronos-forecasting==2.2.2",
    "pandas>=1.5,<3",
]
toto2 = [
    "toto-2 @ git+https://github.com/DataDog/toto.git@44ea4e88852228039564aa3e76fac26aafac0803#subdirectory=toto2",
    "torch>=2.5",
]
automl = [
    "autogluon.timeseries>=1.5,<1.6",
    "pandas>=1.5,<3",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pandas>=1.5,<3",
    "ruff>=0.5",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
time-series-analysis-mcp = "time_series_analysis_mcp.cli:cli"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["time_series_analysis_mcp", "time_series_analysis", "tools"]

[tool.hatch.build.targets.wheel.force-include]
"time_series_analysis/r/deseats_runner.R" = "time_series_analysis/r/deseats_runner.R"
"resources/MODEL_WEIGHTS_MANIFEST.json" = "time_series_analysis_mcp/MODEL_WEIGHTS_MANIFEST.json"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
    "/IMPLEMENTATION_PLAN.md",
    "/time_series_analysis_mcp",
    "/time_series_analysis",
    "/tools",
    "/scripts",
    "/resources",
    "/docs",
    "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: subprocess or protocol-heavy tests",
    "asyncio: async MCP protocol tests",
]
