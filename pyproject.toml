[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "time-series-analysis-mcp"
version = "0.1.0"
description = "Enterprise-oriented MCP server for multi-dimensional time-series analysis and forecasting."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LiChenStuttgart", email = "3380836@gmail.com" }
]
license = { text = "MIT" }
keywords = [
    "mcp",
    "model-context-protocol",
    "time-series",
    "forecasting",
    "data-quality",
    "stationarity",
    "seasonality",
]
dependencies = [
    "mcp>=1.0,<2",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
scientific = [
    "numpy>=1.24,<3",
    "pandas>=1.5,<3",
    "scipy>=1.10,<2",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.2,<2",
    "openpyxl>=3.0,<4",
    "xlrd>=2.0,<3",
    "arch>=6.0,<8",
    "ruptures>=1.1,<2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.5",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
time-series-analysis-mcp = "time_series_analysis_mcp.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["time_series_analysis_mcp", "time_series_analysis", "tools"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
    "/IMPLEMENTATION_PLAN.md",
    "/time_series_analysis_mcp",
    "/time_series_analysis",
    "/tools",
    "/resources",
    "/docs",
    "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: subprocess or protocol-heavy tests",
    "asyncio: async MCP protocol tests",
]
